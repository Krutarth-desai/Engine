name: DevSecOps Security CI Pipeline

on:
  push:
    branches: [ "main", "Multiple-dashboards" ]
  pull_request:
    branches: [ "main", "Multiple-dashboards" ]

jobs:
  security-audit-and-tests:
    name: Continuous Security & Vulnerability Assessment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio PyJWT slowapi supabase matplotlib pandas joblib scikit-learn

      - name: Run DevSecOps Secret Scanner
        run: |
          python scripts/secret_scanner.py

      - name: Run Automated Pytest Security Suite (Phases 1-4)
        run: |
          python -m pytest tests/test_security.py tests/test_phase3_security.py tests/security/ -v

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci

      - name: Run Frontend Type Check & Production Build
        working-directory: ./frontend
        run: |
          npm run build
